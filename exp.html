<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Slider</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .slider-container {
      position: relative;
      width: 70%;
      overflow: hidden;
    }

    .slider {
      display: flex;
      transition: transform 0.3s ease-in-out;
      gap: 20px;
    }

    .slide {
      min-width: 200px;
      flex-shrink: 0;
    }

    .slide img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    button.prev, button.next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      font-size: 2rem;
      padding: 0 10px;
      cursor: pointer;
      border-radius: 5px;
      z-index: 2;
    }

    button.prev { left: 10px; }
    button.next { right: 10px; }
  </style>
</head>
<body>

  <div class="slider-container">
    <button class="prev">&#10094;</button>
    <div class="slider">
      <div class="slide"><img src="https://via.placeholder.com/200x150?text=Product+1" alt="Product 1"></div>
      <div class="slide"><img src="https://via.placeholder.com/200x150?text=Product+2" alt="Product 2"></div>
      <div class="slide"><img src="https://via.placeholder.com/200x150?text=Product+3" alt="Product 3"></div>
      <div class="slide"><img src="https://via.placeholder.com/200x150?text=Product+4" alt="Product 4"></div>
      <div class="slide"><img src="https://via.placeholder.com/200x150?text=Product+5" alt="Product 5"></div>
    </div>
    <button class="next">&#10095;</button>
  </div>

  
</body>
</html>
